name: Pipeline CI/CD - Predicción GHI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  pruebas_algoritmicas:
    runs-on: ubuntu-latest
    
    steps:
    - name: Extraer código fuente
      uses: actions/checkout@v4

    - name: Aprovisionar entorno Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11.9"
        cache: 'pip'

    - name: Instalación de dependencias operativas
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Ejecutar Módulo de Pruebas (Pytest)
      run: |
        pytest pruebas/

  validacion_infraestructura:
    needs: pruebas_algoritmicas
    runs-on: ubuntu-latest
    
    steps:
    - name: Extraer código fuente
      uses: actions/checkout@v4

    - name: Ensamblar Artefacto Inmutable (Docker)
      run: |
        docker build -t motor-predictivo-ghi:validacion .